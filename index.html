<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>BreathFlow</title>
<style>
  :root{
    --bg:#0b0e14; --panel:#141926; --ink:#e8ecf4; --dim:#7d879c;
    --accent:#5eb8ff; --accent2:#8f7bff;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",Segoe UI,Roboto,sans-serif;
    display:flex; flex-direction:column; align-items:center;
    padding:max(env(safe-area-inset-top),16px) 16px max(env(safe-area-inset-bottom),16px);
    min-height:100%;
    user-select:none;-webkit-user-select:none;
  }
  h1{font-size:20px;font-weight:600;letter-spacing:.5px;margin:4px 0 2px}
  .sub{color:var(--dim);font-size:12px;margin-bottom:14px}

  .row{width:100%;max-width:440px;margin-bottom:10px}
  .row-label{font-size:11px;letter-spacing:1.4px;text-transform:uppercase;color:var(--dim);margin:0 2px 6px}
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{
    background:var(--panel);border:1px solid #232b3f;color:var(--ink);
    border-radius:999px;padding:10px 14px;font-size:14px;font-weight:500;
    cursor:pointer;transition:all .15s;
  }
  .chip.small{padding:8px 12px;font-size:13px}
  .chip.on{background:linear-gradient(135deg,var(--accent),var(--accent2));border-color:transparent;color:#08101c;font-weight:700}

  /* breathing stage */
  .stage{
    position:relative;width:100%;max-width:440px;flex:1;min-height:280px;
    display:flex;align-items:center;justify-content:center;margin:8px 0;
  }
  .orb-wrap{position:relative;width:230px;height:230px;display:flex;align-items:center;justify-content:center}
  .orb{
    position:absolute;inset:0;border-radius:50%;
    background:radial-gradient(circle at 38% 32%, #6cc1ff 0%, #4a7dff 45%, #2a2f6e 100%);
    box-shadow:0 0 80px 10px rgba(94,140,255,.35);
    transform:scale(.62);
    will-change:transform,opacity;
  }
  .ring{
    position:absolute;inset:-14px;border-radius:50%;
    border:1px solid rgba(140,170,255,.35);
    transform:scale(.62);
  }
  .phase-txt{
    position:relative;z-index:2;text-align:center;pointer-events:none;
  }
  .phase-name{font-size:26px;font-weight:700;letter-spacing:1px;text-shadow:0 2px 14px rgba(0,0,0,.6)}
  .phase-count{font-size:15px;color:#dfe9ff;opacity:.85;margin-top:2px}
  .session-left{
    position:absolute;bottom:-4px;left:0;right:0;text-align:center;
    font-size:13px;color:var(--dim);font-variant-numeric:tabular-nums;
  }

  /* custom sliders */
  .custom-box{
    display:none;width:100%;max-width:440px;background:var(--panel);
    border:1px solid #232b3f;border-radius:16px;padding:12px 14px;margin-bottom:10px;
  }
  .custom-box.show{display:block}
  .sl{display:flex;align-items:center;gap:10px;margin:8px 0}
  .sl label{width:64px;font-size:13px;color:var(--dim)}
  .sl input{flex:1;accent-color:var(--accent)}
  .sl output{width:38px;text-align:right;font-size:14px;font-variant-numeric:tabular-nums}

  .toggles{display:flex;gap:8px;flex-wrap:wrap}

  .go{
    width:100%;max-width:440px;padding:18px;border-radius:18px;border:none;
    font-size:18px;font-weight:800;letter-spacing:1px;cursor:pointer;
    background:linear-gradient(135deg,var(--accent),var(--accent2));color:#08101c;
    margin-top:4px;
  }
  .go.stop{background:#2a1f2e;color:#ff9d9d;border:1px solid #4d2f3a}
  .hint{font-size:11px;color:var(--dim);margin-top:8px;text-align:center;max-width:440px}

  body.running .row,body.running .custom-box,body.running .sub{display:none}
  body.running .stage{min-height:380px}
  body.running .orb-wrap{width:280px;height:280px}
</style>
</head>
<body>
  <h1>BreathFlow</h1>
  <div class="sub">sound-guided breathing · no voice, ever</div>

  <div class="row">
    <div class="row-label">Mode</div>
    <div class="chips" id="modes"></div>
  </div>

  <div class="custom-box" id="customBox">
    <div class="sl"><label>Inhale</label><input type="range" min="1" max="12" step="0.5" value="4" id="cIn"><output id="oIn">4s</output></div>
    <div class="sl"><label>Hold</label><input type="range" min="0" max="12" step="0.5" value="4" id="cHold"><output id="oHold">4s</output></div>
    <div class="sl"><label>Exhale</label><input type="range" min="1" max="14" step="0.5" value="6" id="cOut"><output id="oOut">6s</output></div>
    <div class="sl"><label>Rest</label><input type="range" min="0" max="10" step="0.5" value="0" id="cRest"><output id="oRest">0s</output></div>
  </div>

  <div class="row">
    <div class="row-label">Length</div>
    <div class="chips" id="lengths"></div>
  </div>

  <div class="row">
    <div class="row-label">Sound</div>
    <div class="chips" id="sounds"></div>
  </div>

  <div class="row">
    <div class="row-label">Bells</div>
    <div class="chips toggles">
      <div class="chip small on" id="tGong">End gong</div>
      <div class="chip small" id="tMin">Minute chime</div>
    </div>
  </div>

  <div class="stage">
    <div class="orb-wrap">
      <div class="ring" id="ring"></div>
      <div class="orb" id="orb"></div>
      <div class="phase-txt">
        <div class="phase-name" id="phaseName">Ready</div>
        <div class="phase-count" id="phaseCount"></div>
      </div>
    </div>
    <div class="session-left" id="sessionLeft"></div>
  </div>

  <button class="go" id="goBtn">BEGIN</button>
  <div class="hint" id="hint">Keep the screen on during a session (audio pauses if the phone locks). Sleep mode fades to silence — no gong.</div>

<script>
(() => {
  // ---------- config ----------
  const MODES = {
    calm:     {label:'Calm 4·7·8',   in:4,  hold:7, out:8,  rest:0},
    box:      {label:'Focus Box',    in:4,  hold:4, out:4,  rest:4},
    flow:     {label:'Flow 5.5',     in:5.5,hold:0, out:5.5,rest:0},
    energize: {label:'Energize',     in:4,  hold:0, out:2,  rest:0},
    sleep:    {label:'Sleep',        in:4,  hold:7, out:8,  rest:0, fade:true},
    custom:   {label:'Custom',       in:4,  hold:4, out:6,  rest:0},
  };
  const LENGTHS = [{l:'3 min',v:180},{l:'5 min',v:300},{l:'10 min',v:600},{l:'20 min',v:1200},{l:'∞',v:0}];
  const SOUNDS = ['Pink','Brown','Ocean','Bowl'];

  let mode='calm', lengthSec=300, sound='Pink';
  let gongOn=true, minOn=false;
  let running=false, runToken=0;

  // ---------- UI build ----------
  const $=id=>document.getElementById(id);
  function chips(elId, items, getLabel, isOn, onPick){
    const el=$(elId); el.innerHTML='';
    items.forEach(it=>{
      const c=document.createElement('div');
      c.className='chip'+(isOn(it)?' on':'');
      c.textContent=getLabel(it);
      c.onclick=()=>{ onPick(it); render(); };
      el.appendChild(c);
    });
  }
  function render(){
    chips('modes', Object.keys(MODES), k=>MODES[k].label, k=>k===mode, k=>{mode=k;});
    chips('lengths', LENGTHS, o=>o.l, o=>o.v===lengthSec, o=>{lengthSec=o.v;});
    chips('sounds', SOUNDS, s=>s, s=>s===sound, s=>{sound=s;});
    $('customBox').classList.toggle('show', mode==='custom');
    $('tGong').classList.toggle('on', gongOn);
    $('tMin').classList.toggle('on', minOn);
  }
  $('tGong').onclick=()=>{gongOn=!gongOn;render();};
  $('tMin').onclick=()=>{minOn=!minOn;render();};
  [['cIn','oIn'],['cHold','oHold'],['cOut','oOut'],['cRest','oRest']].forEach(([i,o])=>{
    $(i).oninput=()=>{ $(o).textContent=$(i).value+'s'; };
  });
  render();

  // ---------- audio engine ----------
  let AC=null, master=null, breathGain=null, tone=null, filter=null, srcNode=null;
  const FLOOR=0.14; // noise level at "empty lungs"

  function ctx(){ if(!AC){ AC=new (window.AudioContext||window.webkitAudioContext)(); } return AC; }

  function makeNoiseBuffer(type){
    const ac=ctx(), len=ac.sampleRate*4, buf=ac.createBuffer(1,len,ac.sampleRate);
    const d=buf.getChannelData(0);
    if(type==='Brown'||type==='Ocean'){
      let last=0;
      for(let i=0;i<len;i++){ const w=Math.random()*2-1; last=(last+0.02*w)/1.02; d[i]=last*3.5; }
    } else { // Pink — Paul Kellet
      let b0=0,b1=0,b2=0,b3=0,b4=0,b5=0,b6=0;
      for(let i=0;i<len;i++){
        const w=Math.random()*2-1;
        b0=0.99886*b0+w*0.0555179; b1=0.99332*b1+w*0.0750759;
        b2=0.96900*b2+w*0.1538520; b3=0.86650*b3+w*0.3104856;
        b4=0.55000*b4+w*0.5329522; b5=-0.7616*b5-w*0.0168980;
        d[i]=(b0+b1+b2+b3+b4+b5+b6+w*0.5362)*0.11; b6=w*0.115926;
      }
    }
    return buf;
  }

  function startBed(){
    const ac=ctx();
    master=ac.createGain(); master.gain.value=0.9; master.connect(ac.destination);
    breathGain=ac.createGain(); breathGain.gain.value=FLOOR;
    filter=ac.createBiquadFilter(); filter.type='lowpass'; filter.frequency.value=900; filter.Q.value=0.4;

    if(sound==='Bowl'){
      // soft harmonic pad instead of noise
      tone={oscs:[],g:ac.createGain()}; tone.g.gain.value=0.5;
      [110,164.8,220,277].forEach((f,i)=>{
        const o=ac.createOscillator(); o.type='sine'; o.frequency.value=f;
        const og=ac.createGain(); og.gain.value=[0.5,0.22,0.16,0.08][i];
        o.connect(og); og.connect(tone.g); o.start(); tone.oscs.push(o);
      });
      tone.g.connect(breathGain);
      breathGain.connect(master);
    } else {
      srcNode=ac.createBufferSource();
      srcNode.buffer=makeNoiseBuffer(sound);
      srcNode.loop=true;
      srcNode.connect(filter); filter.connect(breathGain); breathGain.connect(master);
      srcNode.start();
      if(sound==='Ocean'){
        // slow swell LFO on the filter for wave feel
        const lfo=ac.createOscillator(), lg=ac.createGain();
        lfo.frequency.value=0.09; lg.gain.value=420;
        lfo.connect(lg); lg.connect(filter.frequency); lfo.start();
        tone={oscs:[lfo],g:null};
        filter.frequency.value=620;
      }
    }
  }

  function stopBed(){
    try{ if(srcNode){srcNode.stop();srcNode.disconnect();} }catch(e){}
    try{ if(tone){tone.oscs.forEach(o=>{try{o.stop();o.disconnect();}catch(e){}}); if(tone.g)tone.g.disconnect();} }catch(e){}
    try{ if(filter)filter.disconnect(); if(breathGain)breathGain.disconnect(); }catch(e){}
    srcNode=null;tone=null;filter=null;breathGain=null;
  }

  function gong(big){
    const ac=ctx(), t=ac.currentTime;
    const g=ac.createGain(); g.gain.value=0; g.connect(ac.destination);
    const partials= big? [[98,1],[147.6,0.55],[221,0.35],[329,0.2],[437,0.12],[589,0.08]]
                       : [[660,0.5],[1320,0.18]];
    const dur=big?9:3;
    partials.forEach(([f,a])=>{
      const o=ac.createOscillator(); o.type='sine';
      o.frequency.value=f*(1+ (Math.sin(f)*0.0007)); // slight inharmonicity
      const og=ac.createGain();
      og.gain.setValueAtTime(0.0001,t);
      og.gain.exponentialRampToValueAtTime(a*(big?0.5:0.3), t+0.02);
      og.gain.exponentialRampToValueAtTime(0.0001, t+dur);
      o.connect(og); og.connect(g); o.start(t); o.stop(t+dur+0.1);
    });
    g.gain.setValueAtTime(1,t);
  }

  // breath envelope for one phase
  function ramp(target, secs){
    if(!breathGain) return;
    const p=breathGain.gain, t=ctx().currentTime;
    p.cancelScheduledValues(t);
    p.setValueAtTime(p.value,t);
    p.linearRampToValueAtTime(target, t+Math.max(secs,0.05));
    if(filter && sound!=='Ocean'){
      const f=filter.frequency;
      f.cancelScheduledValues(t); f.setValueAtTime(f.value,t);
      f.linearRampToValueAtTime(target>0.5?1500:650, t+Math.max(secs,0.05));
    }
  }

  // ---------- visuals ----------
  const orb=$('orb'), ring=$('ring');
  function orbTo(scale, secs){
    [orb,ring].forEach(el=>{
      el.style.transition=`transform ${secs}s cubic-bezier(.37,.01,.45,1)`;
      el.style.transform=`scale(${scale})`;
    });
  }

  // ---------- session ----------
  const sleep=(ms,tok)=>new Promise(r=>setTimeout(()=>r(tok===runToken),ms));
  let wakeLock=null;
  async function grabWake(){ try{ wakeLock=await navigator.wakeLock?.request('screen'); }catch(e){} }

  function phaseSpec(){
    if(mode!=='custom') return MODES[mode];
    return {in:+$('cIn').value, hold:+$('cHold').value, out:+$('cOut').value, rest:+$('cRest').value};
  }

  async function countdown(name, secs, tok){
    $('phaseName').textContent=name;
    let left=secs;
    while(left>0.01){
      $('phaseCount').textContent=Math.ceil(left)+'';
      const step=Math.min(1,left);
      if(!await sleep(step*1000,tok)) return false;
      left-=step;
    }
    return true;
  }

  async function run(){
    const tok=++runToken;
    const spec=phaseSpec(), isSleep=(mode==='sleep');
    const total=lengthSec; // 0 = endless
    const startT=Date.now();
    let lastMin=0;

    ctx().resume();
    startBed();
    grabWake();
    document.body.classList.add('running');
    $('goBtn').textContent='END SESSION'; $('goBtn').classList.add('stop');
    $('hint').textContent='';

    // sleep-mode long fade across whole session
    if(isSleep && total>0 && master){
      const t=ctx().currentTime;
      master.gain.setValueAtTime(0.9,t);
      master.gain.linearRampToValueAtTime(0.0001, t+total);
    }

    while(runToken===tok){
      const elapsed=(Date.now()-startT)/1000;
      if(total>0 && elapsed>=total) break;
      if(total>0){
        const left=total-elapsed;
        $('sessionLeft').textContent=Math.floor(left/60)+':'+String(Math.floor(left%60)).padStart(2,'0');
      } else {
        $('sessionLeft').textContent=Math.floor(elapsed/60)+':'+String(Math.floor(elapsed%60)).padStart(2,'0');
      }
      if(minOn){ const m=Math.floor(elapsed/60); if(m>lastMin){ lastMin=m; gong(false); } }

      // INHALE — sound swells, orb grows
      ramp(1.0, spec.in); orbTo(1.0, spec.in);
      if(!await countdown('Inhale', spec.in, tok)) return;
      // HOLD
      if(spec.hold>0){ if(!await countdown('Hold', spec.hold, tok)) return; }
      // EXHALE — sound falls, orb shrinks
      ramp(FLOOR, spec.out); orbTo(0.62, spec.out);
      if(!await countdown('Exhale', spec.out, tok)) return;
      // REST
      if(spec.rest>0){ if(!await countdown('Rest', spec.rest, tok)) return; }
    }

    if(runToken===tok){ // natural end
      endSession(!isSleep && gongOn);
    }
  }

  function endSession(withGong){
    runToken++;
    stopBed();
    if(withGong) gong(true);
    try{ wakeLock?.release(); }catch(e){}
    wakeLock=null;
    document.body.classList.remove('running');
    orbTo(0.62,1.2);
    $('phaseName').textContent='Done';
    $('phaseCount').textContent='';
    $('sessionLeft').textContent='';
    $('goBtn').textContent='BEGIN'; $('goBtn').classList.remove('stop');
    $('hint').textContent='Keep the screen on during a session (audio pauses if the phone locks). Sleep mode fades to silence — no gong.';
    running=false;
  }

  $('goBtn').onclick=()=>{
    if(running){ endSession(false); return; }
    running=true; run();
  };
})();
</script>
</body>
</html>
